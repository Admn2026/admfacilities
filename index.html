// ---------- storage shim: mimics the artifact window.storage API, backed by a shared database ----------
// Isso faz os dados (chamados, requisições, chat) ficarem compartilhados entre TODAS as
// pessoas que acessam o app, em vez de ficarem isolados no navegador de cada uma.
// Troque a URL abaixo pela função /api/storage publicada (veja storage-function/README.md).
const STORAGE_API_URL = "https://chamados-facilities-two.vercel.app/api/storage";

window.storage = {
  async get(key) {
    try {
      const r = await fetch(`${STORAGE_API_URL}?key=${encodeURIComponent(key)}`);
      const data = await r.json();
      if (data.value === null || data.value === undefined) return null;
      return { key, value: data.value, shared: true };
    } catch (err) {
      console.error("Falha ao ler do banco compartilhado:", err);
      return null;
    }
  },
  async set(key, value) {
    try {
      await fetch(STORAGE_API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "set", key, value }),
      });
      return { key, value, shared: true };
    } catch (err) {
      console.error("Falha ao salvar no banco compartilhado:", err);
      return null;
    }
  },
  async delete(key) {
    try {
      await fetch(STORAGE_API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "delete", key }),
      });
      return { key, deleted: true, shared: true };
    } catch (err) {
      console.error("Falha ao apagar do banco compartilhado:", err);
      return null;
    }
  },
  async list() {
    return { keys: [] }; // não usado pelo app atualmente
  },
};

  const s = Math.max(10, Math.round(size * 0.62));

    <span className={className} style={{ display: "inline-flex", alignItems: "center", gap: size <= 16 ? 1 : 3, ...style }}>
      <Zap size={s} />
      <Droplets size={s} />
      <Wrench size={s} />
    </span>
  );
}

// ---------- envio real de e-mail (via função serverless + SendGrid) ----------
// Depois de publicar a função (veja send-email-function/README.md), troque a URL abaixo
// pela URL real que a Vercel te der, terminando em "/api/send-email".
const EMAIL_API_URL = "https://chamados-facilities-two.vercel.app/api/send-email";

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function buildEmailHtml(subject, body) {
  const protocolMatch = subject.match(/[A-Z]+-\d{4}-\d{4}/);
  const protocol = protocolMatch ? protocolMatch[0] : null;
  return `
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F4F2EC;padding:24px 0;font-family:Arial,Helvetica,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;overflow:hidden;border:1px solid #DDD6C8;">
        <tr>
          <td style="background:#1F3A5F;padding:18px 24px;">
            <span style="color:#F2A93B;font-weight:bold;font-size:13px;letter-spacing:1px;">CENTRAL DE FACILITIES</span>
          </td>
        </tr>
        <tr>
          <td style="padding:28px 24px 8px;">
            <h1 style="margin:0 0 14px;font-size:19px;color:#1F2937;font-family:Arial,Helvetica,sans-serif;">${escapeHtml(subject)}</h1>
            <p style="margin:0 0 18px;font-size:14px;line-height:1.6;color:#374151;">${escapeHtml(body)}</p>
            ${protocol ? `<div style="display:inline-block;background:#FBF0DE;border:1px solid #F2A93B;border-radius:6px;padding:8px 14px;font-family:'Courier New',monospace;font-weight:bold;color:#C97A1F;font-size:15px;">${protocol}</div>` : ""}
          </td>
        </tr>
        <tr>
          <td style="padding:16px 24px;background:#F7F5F0;border-top:1px solid #EDEAE0;">
            <p style="margin:0;font-size:11px;color:#9AA5B1;">Central de Facilities · Documento interno · Este é um e-mail automático, não é necessário responder.</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>`;
}

async function sendRealEmail(to, subject, body) {
  if (!EMAIL_API_URL || EMAIL_API_URL.includes("SEU-PROJETO")) return; // função ainda não configurada
  try {
    await fetch(EMAIL_API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ to, subject, body, html: buildEmailHtml(subject, body) }),
    });
  } catch (err) {
    console.error("Falha ao enviar e-mail real:", err);
  }
}

// ---------- storage helpers ----------
async function loadRev(key) {
  try {
    const r = await window.storage.get(key);
    return r ? r.value : null;
  } catch { return null; }
}
async function bumpRev(key) {
  try { await window.storage.set(key, String(Date.now())); } catch {}
}

async function loadTickets() {
  try {
    const r = await window.storage.get("tickets");
    return r ? JSON.parse(r.value) : [];
  } catch { return []; }
}
async function saveTickets(tickets) {
  try { await window.storage.set("tickets", JSON.stringify(tickets)); } catch {}
  await bumpRev("tickets_rev");
}
async function loadThread(id) {
  try {
    const r = await window.storage.get(`thread:${id}`);
    return r ? JSON.parse(r.value) : { chat: [], notif: [] };
  } catch { return { chat: [], notif: [] }; }
}
async function saveThread(id, thread) {
  try { await window.storage.set(`thread:${id}`, JSON.stringify(thread)); } catch {}
  await bumpRev(`thread_rev:${id}`);
}
async function loadAnexo(ticketId) {
  try {
    const r = await window.storage.get(`anexo:${ticketId}`);
    return r ? JSON.parse(r.value) : null;
  } catch { return null; }
}
async function saveAnexo(ticketId, anexo) {
  try { await window.storage.set(`anexo:${ticketId}`, JSON.stringify(anexo)); } catch {}
}
async function loadRequisicoes() {
  try {
    const r = await window.storage.get("requisicoes");
    return r ? JSON.parse(r.value) : [];
  } catch { return []; }
}
async function saveRequisicoes(list) {
  try { await window.storage.set("requisicoes", JSON.stringify(list)); } catch {}
  await bumpRev("requisicoes_rev");
}
async function loadItemStatus() {
  try {
    const r = await window.storage.get("item-status");
    return r ? JSON.parse(r.value) : {};
  } catch { return {}; }
}
async function saveItemStatus(map) {
  try { await window.storage.set("item-status", JSON.stringify(map)); } catch {}
}

function protocolFor(prefix, n) {
  const y = new Date().getFullYear();
  return `${prefix}-${y}-${String(n).padStart(4, "0")}`;
}
function timeLabel(iso) {
  const d = new Date(iso);
  return d.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
}
function catInfo(id) { return CATEGORIAS.find(c => c.id === id) || CATEGORIAS[CATEGORIAS.length - 1]; }

function FacilitiesApp() {
  const [tab, setTab] = useState("home");
  const [tickets, setTickets] = useState(null);
  const [requisicoes, setRequisicoes] = useState(null);
  const [itemStatus, setItemStatus] = useState({});
  const [selected, setSelected] = useState(null);
  const [thread, setThread] = useState({ chat: [], notif: [] });
  const [painelAuth, setPainelAuth] = useState(false);
  const pollRef = useRef(null);
  const ticketsRevRef = useRef(null);
  const requisicoesRevRef = useRef(null);
  const threadRevRef = useRef({ id: null, rev: null });

  const refreshTickets = useCallback(async (force = false) => {
    const rev = await loadRev("tickets_rev");
    if (!force && rev !== null && rev === ticketsRevRef.current) return; // nada mudou, não baixa a lista inteira
    ticketsRevRef.current = rev;
    const t = await loadTickets();
    setTickets(t);
  }, []);

  useEffect(() => {
    const needsTickets = tab === "acompanhar" || tab === "painel";
    if (!needsTickets) return;
    refreshTickets(true);
    const id = setInterval(() => {
      if (document.visibilityState === "visible") refreshTickets();
    }, 20000); // checagem leve a cada 20s — só baixa os dados completos quando algo realmente muda
    const onVis = () => { if (document.visibilityState === "visible") refreshTickets(); };
    document.addEventListener("visibilitychange", onVis);
    return () => { clearInterval(id); document.removeEventListener("visibilitychange", onVis); };
  }, [refreshTickets, tab]);

  const refreshRequisicoes = useCallback(async (force = false) => {
    const rev = await loadRev("requisicoes_rev");
    if (!force && rev !== null && rev === requisicoesRevRef.current) return;
    requisicoesRevRef.current = rev;
    const r = await loadRequisicoes();
    setRequisicoes(r);
  }, []);

  useEffect(() => {
    const needsRequisicoes = tab === "acompanhar" || tab === "painel";
    if (!needsRequisicoes) return;
    refreshRequisicoes(true);
    const id = setInterval(() => {
      if (document.visibilityState === "visible") refreshRequisicoes();
    }, 20000);
    const onVis = () => { if (document.visibilityState === "visible") refreshRequisicoes(); };
    document.addEventListener("visibilitychange", onVis);
    return () => { clearInterval(id); document.removeEventListener("visibilitychange", onVis); };
  }, [refreshRequisicoes, tab]);

  const refreshThread = useCallback(async (id, force = false) => {
    if (!id) return;
    const rev = await loadRev(`thread_rev:${id}`);
    if (!force && threadRevRef.current.id === id && rev !== null && rev === threadRevRef.current.rev) return;
    threadRevRef.current = { id, rev };
    const th = await loadThread(id);
    setThread(th);
  }, []);

  useEffect(() => {
    if (!selected) return;
    refreshThread(selected, true);
    pollRef.current = setInterval(() => {
      if (document.visibilityState === "visible") refreshThread(selected);
    }, 8000); // checagem leve a cada 8s — o chat parece ágil sem baixar a conversa inteira toda hora
    const onVis = () => { if (document.visibilityState === "visible") refreshThread(selected); };
    document.addEventListener("visibilitychange", onVis);
    return () => { clearInterval(pollRef.current); document.removeEventListener("visibilitychange", onVis); };
  }, [selected, refreshThread]);

  async function pushNotification(id, entries) {
    const th = await loadThread(id);
    th.notif = [...th.notif, ...entries];
    await saveThread(id, th);
    entries.forEach(e => sendRealEmail(e.to, e.subject, e.body));
  }

  async function createTicket(form) {
    const [allTickets, allReq] = await Promise.all([loadTickets(), loadRequisicoes()]);
    const num = allTickets.length + allReq.length + 1;
    const protocol = protocolFor("CH", num);
    const now = new Date().toISOString();
    const { anexo, ...formRest } = form;
    const ticket = { id: protocol, ...formRest, hasAnexo: !!anexo, status: "aberto", createdAt: now, updatedAt: now };
    const updated = [ticket, ...allTickets];
    await saveTickets(updated);
    if (anexo) await saveAnexo(protocol, anexo);
    await saveThread(protocol, { chat: [], notif: [] });
    await pushNotification(protocol, [
      { to: form.email, subject: `Chamado ${protocol} aberto com sucesso`, body: `Recebemos sua solicitação (${catInfo(form.categoria).label}). Você será notificado por e-mail a cada atualização.`, time: now },
      { to: FACILITIES_EMAIL, subject: `Novo chamado ${protocol} — ${catInfo(form.categoria).label}`, body: `Aberto por ${form.nome} (${form.email}) — ${form.setor} — em ${form.local} — ${form.empresa}. Categoria: ${catInfo(form.categoria).label}${form.subcategoria ? " - " + form.subcategoria : ""}.`, time: now },
    ]);
    await refreshTickets(true);
    return protocol;
  }

  async function updateStatus(id, statusKey) {
    const current = await loadTickets();
    const updated = current.map(t => t.id === id ? { ...t, status: statusKey, updatedAt: new Date().toISOString() } : t);
    await saveTickets(updated);
    const t = updated.find(x => x.id === id);
    const now = new Date().toISOString();
    await pushNotification(id, [
      { to: t.email, subject: `Chamado ${id} — status atualizado para ${STATUS[statusKey].label}`, body: `A equipe de facilities atualizou o status do seu chamado.`, time: now },
      { to: FACILITIES_EMAIL, subject: `Chamado ${id} atualizado`, body: `Status alterado para ${STATUS[statusKey].label}.`, time: now },
    ]);
    await refreshTickets(true);
  }

  async function createRequisicao(form) {
    const [allTickets, allReq] = await Promise.all([loadTickets(), loadRequisicoes()]);
    const num = allTickets.length + allReq.length + 1;
    const protocol = protocolFor("REQ", num);
    const now = new Date().toISOString();
    const requisicao = { id: protocol, nome: form.nome, email: form.email, setor: form.setor, itens: form.itens, outros: form.outros, entregues: {}, status: "pendente", createdAt: now, updatedAt: now };
    const updated = [requisicao, ...allReq];
    await saveRequisicoes(updated);
    await refreshRequisicoes(true);

    const itemsText = itemsSummary(requisicao);
    sendRealEmail(form.email, `Requisição ${protocol} registrada`, `Recebemos sua requisição de materiais (${itemsText}). Você será notificado quando ela for entregue.`);
    sendRealEmail(FACILITIES_EMAIL, `Nova requisição ${protocol} — ${form.setor}`, `Aberta por ${form.nome} (${form.email}) — ${form.setor}. Itens: ${itemsText}.`);

    return protocol;
  }

  async function updateRequisicaoStatus(id, statusKey) {
    const current = await loadRequisicoes();
    const updated = current.map(r => r.id === id ? { ...r, status: statusKey, updatedAt: new Date().toISOString() } : r);
    await saveRequisicoes(updated);
    await refreshRequisicoes(true);
  }

  async function updateRequisicaoItemEntregue(id, itemName) {
    const current = await loadRequisicoes();
    let justCompleted = null;
    const updated = current.map(r => {
      if (r.id !== id) return r;
      const entregues = { ...(r.entregues || {}), [itemName]: !(r.entregues || {})[itemName] };
      const items = reqItemsList(r);
      const allDone = items.length > 0 && items.every(it => entregues[it.name]);
      const newStatus = allDone ? "entregue" : "pendente";
      const updatedReq = { ...r, entregues, status: newStatus, updatedAt: new Date().toISOString() };
      if (newStatus === "entregue" && r.status !== "entregue") justCompleted = updatedReq;
      return updatedReq;
    });
    await saveRequisicoes(updated);
    await refreshRequisicoes(true);
    if (justCompleted) {
      sendRealEmail(justCompleted.email, `Requisição ${justCompleted.id} entregue`, `Sua requisição de materiais (${itemsSummary(justCompleted)}) foi totalmente entregue.`);
    }
  }

  async function sendChat(id, sender, text) {
    if (!text.trim()) return;
    const th = await loadThread(id);
    const msg = { sender, text: text.trim(), time: new Date().toISOString() };
    th.chat = [...th.chat, msg];
    await saveThread(id, th);
    const allTickets = await loadTickets();
    const t = allTickets.find(x => x.id === id);
    if (t) {
      const notifyTarget = sender === "usuario" ? FACILITIES_EMAIL : t.email;
      await pushNotification(id, [{ to: notifyTarget, subject: `Nova mensagem no chamado ${id}`, body: text.trim(), time: msg.time }]);
    }
    await refreshThread(id, true);
  }

  const selectedTicket = (tickets || []).find(t => t.id === selected) || null;
  const selectedRequisicao = (requisicoes || []).find(r => r.id === selected) || null;

  return (
    <>
      {tab === "home" && (
        <HomeScreen
          ticketCount={tickets ? tickets.length : null}
          requisicaoCount={requisicoes ? requisicoes.length : null}
          onNavigate={(t) => { setTab(t); setSelected(null); }}
        />
      )}
      {tab !== "home" && (
        <div className="min-h-screen w-full" style={{ background: "linear-gradient(180deg, #14273D 0%, #0A141F 100%)", fontFamily: "'Inter', sans-serif" }}>
          <style>{`input::placeholder, textarea::placeholder { color: #5B6B80; opacity: 1; }`}</style>
          <header className="border-b" style={{ borderColor: "#223751", background: "#16283F" }}>
            <div className="max-w-5xl mx-auto px-5 py-4 flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <Building2 size={20} color="#F2A93B" />
                <h1 className="text-white text-base font-semibold leading-none" style={{ fontFamily: "'Oswald', sans-serif", letterSpacing: "0.02em" }}>CENTRAL DE FACILITIES</h1>
              </div>
              <button type="button" onClick={() => { setTab("home"); setSelected(null); }}
                className="flex items-center gap-1 text-xs font-medium px-2.5 py-1 rounded-sm" style={{ color: "#9FB0C4" }}>
                <ChevronLeft size={14} /> início
              </button>
              {tab === "painel" && painelAuth && (
                <button type="button" onClick={() => { setPainelAuth(false); setTab("home"); setSelected(null); }}
                  className="flex items-center gap-1 text-xs font-medium px-2.5 py-1 rounded-sm" style={{ color: "#9FB0C4" }}>
                  sair
                </button>
              )}
            </div>
          </header>

          <main className="max-w-5xl mx-auto px-5 py-8">
            {tab === "abrir" && <AbrirChamado onSubmit={createTicket} />}
            {tab === "materiais" && <RequisicaoForm onSubmit={createRequisicao} itemStatus={itemStatus} />}
            {tab === "acompanhar" && (
              selectedTicket
                ? <TicketDetail ticket={selectedTicket} thread={thread} viewer="usuario" onBack={() => setSelected(null)} onSend={(text) => sendChat(selectedTicket.id, "usuario", text)} />
                : selectedRequisicao
                  ? <RequisicaoStatusView requisicao={selectedRequisicao} onBack={() => setSelected(null)} />
                  : <AcompanharBusca tickets={tickets} requisicoes={requisicoes} onFound={(id) => setSelected(id)} />
            )}
            {tab === "painel" && (
              !painelAuth
                ? <PainelLogin onSuccess={() => setPainelAuth(true)} />
                : selectedTicket
                  ? <TicketDetail ticket={selectedTicket} thread={thread} viewer="facilities" onBack={() => setSelected(null)} onSend={(text) => sendChat(selectedTicket.id, "facilities", text)} onStatusChange={(s) => updateStatus(selectedTicket.id, s)} />
                  : <PainelEquipe tickets={tickets} requisicoes={requisicoes} itemStatus={itemStatus} onOpen={(id) => setSelected(id)} onUpdateRequisicao={updateRequisicaoStatus} onToggleReqItem={updateRequisicaoItemEntregue} />
            )}
          </main>
        </div>
      )}
    </>
  );
}

function AbrirChamado({ onSubmit }) {
  const [form, setForm] = useState({ nome: "", email: "", local: "", empresa: "", setor: "", categoria: "geral", subcategoria: "", descricao: "", anexo: null });
  const [protocol, setProtocol] = useState(null);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [anexoError, setAnexoError] = useState("");
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const selectCategoria = (id) => setForm(f => ({ ...f, categoria: id, subcategoria: "" }));
  const catDef = CATEGORIAS.find(c => c.id === form.categoria);

  function handleFileChange(e) {
    const file = e.target.files?.[0];
    e.target.value = "";
    if (!file) return;
    if (file.size > 1.5 * 1024 * 1024) {
      setAnexoError("Arquivo muito grande. O limite é 1,5 MB.");
      return;
    }
    setAnexoError("");
    const reader = new FileReader();
    reader.onload = () => set("anexo", { name: file.name, type: file.type, dataUrl: reader.result });
    reader.readAsDataURL(file);
  }

  async function handleSubmit(e) {
    e.preventDefault();
    const missing = [];
    if (!form.nome) missing.push("Seu nome");
    if (!form.email) missing.push("Seu e-mail");
    if (!form.empresa) missing.push("Empresa");
    if (!form.setor) missing.push("Setor");
    if (!form.local) missing.push("Local");
    if (catDef.subcategorias && !form.subcategoria) missing.push("Subcategoria");
    if (!form.descricao) missing.push("Descrição do problema");
    if (missing.length) {
      setError(`Preencha antes de enviar: ${missing.join(", ")}.`);
      return;
    }
    setError("");
    setBusy(true);
    const p = await onSubmit(form);
    setBusy(false);
    setProtocol(p);
    setForm({ nome: "", email: "", local: "", empresa: "", setor: "", categoria: "geral", subcategoria: "", descricao: "", anexo: null });
  }

  if (protocol) {
    return (
      <div className="max-w-lg mx-auto text-center py-14 px-6 rounded-md border" style={{ background: "#132234", borderColor: "#223751" }}>
        <CheckCircle2 size={30} style={{ color: "#6FCF97" }} className="mx-auto mb-3" />
        <p className="text-sm" style={{ color: "#9FB0C4" }}>Chamado registrado</p>
        <p className="mt-1 text-2xl font-bold" style={{ fontFamily: "'JetBrains Mono', monospace", color: "#F2A93B" }}>{protocol}</p>
        <p className="mt-4 text-sm" style={{ color: "#9FB0C4" }}>Enviamos um e-mail de confirmação. Guarde este número para acompanhar o andamento na tela <b style={{ color: "#fff" }}>Acompanhar</b>.</p>
        <button type="button" onClick={() => setProtocol(null)} className="mt-6 text-sm font-semibold px-4 py-2 rounded-sm" style={{ background: "#F2A93B", color: "#1F2937" }}>Abrir outro chamado</button>
      </div>
    );
  }

  return (
    <form onSubmit={handleSubmit} className="max-w-4xl mx-auto rounded-md border p-6 sm:p-10" style={{ background: "#132234", borderColor: "#223751" }}>
      <h2 className="text-xl font-semibold mb-1" style={{ fontFamily: "'Oswald', sans-serif", color: "#fff" }}>Descreva o problema</h2>
      <p className="text-sm mb-6" style={{ color: "#9FB0C4" }}>Todos os campos são obrigatórios. Você receberá cada atualização por e-mail.</p>

      <div className="grid sm:grid-cols-3 gap-4 mb-4">
        <Field label="Seu nome"><input value={form.nome} onChange={e => set("nome", e.target.value)} className="w-full px-3 py-2 rounded-sm border text-sm" style={{ background: "#0F1E30", borderColor: "#2C4A6B", color: "#fff" }} placeholder="Maria Silva" /></Field>
        <Field label="Seu e-mail"><input type="email" value={form.email} onChange={e => set("email", e.target.value)} className="w-full px-3 py-2 rounded-sm border text-sm" style={{ background: "#0F1E30", borderColor: "#2C4A6B", color: "#fff" }} placeholder="maria@empresa.com" /></Field>
        <Field label="Setor">
          <select value={form.setor} onChange={e => set("setor", e.target.value)}
            className="w-full px-3 py-2 rounded-sm border text-sm"
            style={{ background: "#0F1E30", borderColor: "#2C4A6B", color: form.setor ? "#fff" : "#5B6B80" }}>
            <option value="" disabled>Selecione...</option>
            {SETORES.map(s => <option key={s} value={s}>{s}</option>)}
          </select>
        </Field>
      </div>

      <div className="grid sm:grid-cols-2 gap-4 mb-4">
        <Field label="Empresa">
          <div className="flex gap-2">
            {EMPRESAS.map(emp => (
              <button type="button" key={emp} onClick={() => set("empresa", emp)}
                className="px-3 py-2 rounded-sm border text-xs font-semibold flex-1"
                style={{ borderColor: form.empresa === emp ? "#F2A93B" : "#2C4A6B", background: form.empresa === emp ? "#F2A93B" : "transparent", color: form.empresa === emp ? "#1F2937" : "#9FB0C4" }}>
                {emp}
              </button>
            ))}
          </div>
        </Field>
        <Field label="Local (prédio / andar / sala)">
          <div className="relative">
            <MapPin size={14} className="absolute left-3 top-1/2 -translate-y-1/2" style={{ color: "#5B6B80" }} />
            <input value={form.local} onChange={e => set("local", e.target.value)} className="w-full pl-8 pr-3 py-2 rounded-sm border text-sm" style={{ background: "#0F1E30", borderColor: "#2C4A6B", color: "#fff" }} placeholder="Prédio B, 4º andar, sala 402" />
          </div>
        </Field>
      </div>

      <Field label="Categoria" className="mb-4">
        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2">
          {CATEGORIAS.map(c => {
            const CIcon = c.icon;
            const active = form.categoria === c.id;
            return (
              <button type="button" key={c.id} onClick={() => selectCategoria(c.id)}
                className="flex flex-col items-center gap-1 py-3 rounded-sm border text-xs font-medium"
                style={{ borderColor: active ? "#F2A93B" : "#2C4A6B", background: active ? "#F2A93B" : "transparent", color: active ? "#1F2937" : "#9FB0C4" }}>
                <CIcon size={16} /> {c.label}
              </button>
            );
          })}
        </div>
      </Field>

      {catDef.subcategorias && (
        <Field label="Subcategoria" className="mb-4">
          <select value={form.subcategoria} onChange={e => set("subcategoria", e.target.value)}
            className="w-full sm:w-1/2 px-3 py-2 rounded-sm border text-sm"
            style={{ background: "#0F1E30", borderColor: "#2C4A6B", color: form.subcategoria ? "#fff" : "#5B6B80" }}>
            <option value="" disabled>Selecione...</option>
            {catDef.subcategorias.map(s => <option key={s} value={s}>{s}</option>)}
          </select>
        </Field>
      )}

      <Field label="Descrição do problema" className="mb-6">
        <textarea value={form.descricao} onChange={e => set("descricao", e.target.value)} rows={4}
          className="w-full px-3 py-2 rounded-sm border text-sm resize-none" style={{ background: "#0F1E30", borderColor: "#2C4A6B", color: "#fff" }}
          placeholder="Ex: o ar-condicionado da sala 402 está pingando água no chão." />
      </Field>

      <Field label="Anexo (opcional)" className="mb-6">
        {!form.anexo ? (
          <label className="flex flex-col items-center justify-center gap-1.5 py-6 rounded-sm border-2 border-dashed cursor-pointer"
            style={{ borderColor: "#2C4A6B", color: "#7C8CA0" }}>
            <Paperclip size={18} />
            <span className="text-xs font-medium">Clique para anexar uma foto ou arquivo</span>
            <span className="text-[11px]" style={{ color: "#5B6B80" }}>imagem ou PDF, até 1,5 MB</span>
            <input type="file" accept="image/*,.pdf" className="hidden" onChange={handleFileChange} />
          </label>
        ) : (
          <div className="flex items-center justify-between px-3 py-2.5 rounded-sm border text-sm" style={{ background: "#0F1E30", borderColor: "#2C4A6B", color: "#D7DEE7" }}>
            <span className="flex items-center gap-2 truncate">
              <Paperclip size={14} style={{ color: "#F2A93B" }} /> {form.anexo.name}
            </span>
            <button type="button" onClick={() => set("anexo", null)} className="shrink-0 ml-2" style={{ color: "#7C8CA0" }}>
              <X size={15} />
            </button>
          </div>
        )}
        {anexoError && (
          <p className="text-xs mt-1.5 flex items-center gap-1.5" style={{ color: "#E2574C" }}>
            <AlertTriangle size={12} /> {anexoError}
          </p>
        )}
      </Field>

      {error && (
        <p className="text-xs mb-3 flex items-center gap-1.5" style={{ color: "#E2574C" }}>
          <AlertTriangle size={13} /> {error}
        </p>
      )}

      <button type="submit" disabled={busy} className="w-full py-2.5 rounded-sm text-sm font-semibold disabled:opacity-60" style={{ background: "#F2A93B", color: "#1F2937" }}>
        {busy ? "Enviando..." : "Abrir chamado"}
      </button>
    </form>
  );
}

function Field({ label, children, className = "" }) {
  return (
    <div className={className}>
      <label className="block text-xs font-semibold mb-1.5" style={{ color: "#9FB0C4" }}>{label}</label>
      {children}
    </div>
  );
}

function RequisicaoForm({ onSubmit, itemStatus }) {
  const emptyItens = Object.fromEntries([...MATERIAL_ESCRITORIO, ...INSUMOS].map(i => [i, 0]));
  const [nome, setNome] = useState("");
  const [email, setEmail] = useState("");
  const [setor, setSetor] = useState("");
  const [itens, setItens] = useState(emptyItens);
  const [outros, setOutros] = useState("");
  const [protocol, setProtocol] = useState(null);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");

  function setQty(item, delta) {
    setItens(prev => ({ ...prev, [item]: Math.max(0, prev[item] + delta) }));
  }

  const hasAnyItem = Object.values(itens).some(v => v > 0) || outros.trim().length > 0;

  async function handleSubmit(e) {
    e.preventDefault();
    const missing = [];
    if (!nome) missing.push("Seu nome");
    if (!email) missing.push("Seu e-mail");
    if (!setor) missing.push("Setor");
    if (!hasAnyItem) missing.push("pelo menos 1 item com quantidade (ou preencha Outros)");
    if (missing.length) {
      setError(`Preencha antes de enviar: ${missing.join(", ")}.`);
      return;
    }
    setError("");
    setBusy(true);
    const p = await onSubmit({ nome, email, setor, itens, outros });
    setBusy(false);
    setProtocol(p);
    setNome(""); setEmail(""); setSetor(""); setItens(emptyItens); setOutros("");
  }

  if (protocol) {
    return (
      <div className="max-w-lg mx-auto text-center py-14 px-6 rounded-md border" style={{ background: "#132234", borderColor: "#223751" }}>
        <CheckCircle2 size={30} style={{ color: "#6FCF97" }} className="mx-auto mb-3" />
        <p className="text-sm" style={{ color: "#9FB0C4" }}>Requisição registrada</p>
        <p className="mt-1 text-2xl font-bold" style={{ fontFamily: "'JetBrains Mono', monospace", color: "#F2A93B" }}>{protocol}</p>
        <p className="mt-4 text-sm" style={{ color: "#9FB0C4" }}>A equipe de Facilities foi notificada e vai preparar o material para a próxima entrega de sexta-feira.</p>
        <button type="button" onClick={() => setProtocol(null)} className="mt-6 text-sm font-semibold px-4 py-2 rounded-sm" style={{ background: "#F2A93B", color: "#1F2937" }}>Fazer outra requisição</button>
      </div>
    );
  }

  return (
    <form onSubmit={handleSubmit} className="max-w-4xl mx-auto rounded-md border p-6 sm:p-10" style={{ background: "#132234", borderColor: "#223751" }}>
      <h2 className="text-xl font-semibold mb-1" style={{ fontFamily: "'Oswald', sans-serif", color: "#fff" }}>Requisição de materiais</h2>
      <p className="text-sm mb-6" style={{ color: "#9FB0C4" }}>Pedidos são entregues toda sexta-feira. Marque a quantidade de cada item que precisa.</p>

      <div className="grid sm:grid-cols-3 gap-4 mb-6">
        <Field label="Seu nome"><input value={nome} onChange={e => setNome(e.target.value)} className="w-full px-3 py-2 rounded-sm border text-sm" style={{ background: "#0F1E30", borderColor: "#2C4A6B", color: "#fff" }} placeholder="Maria Silva" /></Field>
        <Field label="Seu e-mail"><input type="email" value={email} onChange={e => setEmail(e.target.value)} className="w-full px-3 py-2 rounded-sm border text-sm" style={{ background: "#0F1E30", borderColor: "#2C4A6B", color: "#fff" }} placeholder="maria@empresa.com" /></Field>
        <Field label="Setor">
          <select value={setor} onChange={e => setSetor(e.target.value)}
            className="w-full px-3 py-2 rounded-sm border text-sm"
            style={{ background: "#0F1E30", borderColor: "#2C4A6B", color: setor ? "#fff" : "#5B6B80" }}>
            <option value="" disabled>Selecione...</option>
            {SETORES.map(s => <option key={s} value={s}>{s}</option>)}
          </select>
        </Field>
      </div>

      <div className="grid sm:grid-cols-2 gap-6 mb-5">
        <div>
          <p className="text-[11px] font-semibold mb-2" style={{ color: "#F2A93B", letterSpacing: "0.08em" }}>ESCRITÓRIO</p>
          <div className="flex flex-col gap-2">
            {MATERIAL_ESCRITORIO.map(item => (
              <QtyRow key={item} label={item} value={itens[item]} onChange={n => setQty(item, n)} emFalta={itemStatus?.[item] === "em_falta"} />
            ))}
          </div>
        </div>
        <div>
          <p className="text-[11px] font-semibold mb-2" style={{ color: "#F2A93B", letterSpacing: "0.08em" }}>INSUMOS</p>
          <div className="flex flex-col gap-2">
            {INSUMOS.map(item => (
              <QtyRow key={item} label={item} value={itens[item]} onChange={n => setQty(item, n)} emFalta={itemStatus?.[item] === "em_falta"} />
            ))}
          </div>
        </div>
      </div>

      <Field label="Outros (opcional)" className="mb-6">
        <input value={outros} onChange={e => setOutros(e.target.value)} className="w-full px-3 py-2 rounded-sm border text-sm" style={{ background: "#0F1E30", borderColor: "#2C4A6B", color: "#fff" }} placeholder="Ex: pilhas, copos descartáveis..." />
      </Field>

      {error && (
        <p className="text-xs mb-3 flex items-center gap-1.5" style={{ color: "#E2574C" }}>
          <AlertTriangle size={13} /> {error}
        </p>
      )}

      <button type="submit" disabled={busy} className="w-full py-2.5 rounded-sm text-sm font-semibold disabled:opacity-60" style={{ background: "#F2A93B", color: "#1F2937" }}>
        {busy ? "Enviando..." : "Enviar requisição"}
      </button>
    </form>
  );
}

function QtyRow({ label, value, onChange, emFalta }) {
  return (
    <div className="rounded-md border px-4 py-3" style={{ background: emFalta ? "rgba(226,87,76,0.06)" : "#0F1E30", borderColor: emFalta ? "#E2574C" : "#2C4A6B" }}>
      <div className="flex items-center justify-between gap-3">
        <span className="text-sm font-medium" style={{ color: "#E7ECF2" }}>{label}</span>
        <div className="flex items-center gap-2 shrink-0">
          <button type="button" onClick={() => onChange(-1)} className="w-7 h-7 rounded-full flex items-center justify-center" style={{ background: "#1B2E45", color: "#9FB0C4" }}><Minus size={13} /></button>
          <span className="w-5 text-center text-sm font-semibold" style={{ color: "#fff" }}>{value}</span>
          <button type="button" onClick={() => onChange(1)} className="w-7 h-7 rounded-full flex items-center justify-center" style={{ background: "#F2A93B", color: "#1F2937" }}><Plus size={13} /></button>
        </div>
      </div>
      {emFalta && (
        <p className="text-[11px] mt-1.5 flex items-center gap-1" style={{ color: "#E2574C" }}><AlertTriangle size={11} /> Em falta no momento</p>
      )}
    </div>
  );
}

function AcompanharBusca({ tickets, requisicoes, onFound }) {
  const [protocolo, setProtocolo] = useState("");
  const [email, setEmail] = useState("");
  const [error, setError] = useState("");

  if (tickets === null || requisicoes === null) return <EmptyState icon={Clock} title="Carregando..." body="Buscando chamados e requisições." />;

  function handleSubmit(e) {
    e.preventDefault();
    const p = protocolo.trim().toLowerCase();
    const em = email.trim().toLowerCase();
    if (!p || !em) return;
    const foundTicket = tickets.find(t => t.id.toLowerCase() === p && t.email.toLowerCase() === em);
    const foundReq = requisicoes.find(r => r.id.toLowerCase() === p && r.email.toLowerCase() === em);
    const found = foundTicket || foundReq;
    if (found) {
      setError("");
      onFound(found.id);
    } else {
      setError("Não encontrado. Confira o protocolo e o e-mail informados no momento da abertura.");
    }
  }

  return (
    <div className="max-w-md mx-auto rounded-md border p-6 sm:p-8" style={{ background: "#132234", borderColor: "#223751" }}>
      <div className="w-10 h-10 rounded-sm flex items-center justify-center mb-4" style={{ background: "#1B2E45" }}>
        <SearchIcon size={18} color="#F2A93B" />
      </div>
      <h2 className="text-xl font-semibold mb-1" style={{ fontFamily: "'Oswald', sans-serif", color: "#fff" }}>Acompanhar chamado ou requisição</h2>
      <p className="text-sm mb-6" style={{ color: "#9FB0C4" }}>
        Por segurança, você só acessa informando o protocolo e o mesmo e-mail usados na abertura.
      </p>
      <form onSubmit={handleSubmit}>
        <Field label="Protocolo" className="mb-4">
          <input value={protocolo} onChange={e => setProtocolo(e.target.value)}
            className="w-full px-3 py-2 rounded-sm border text-sm" style={{ background: "#0F1E30", borderColor: "#2C4A6B", color: "#fff" }}
            placeholder="CH-2026-0001 ou REQ-2026-0001" />
        </Field>
        <Field label="E-mail usado na abertura" className="mb-4">
          <input type="email" value={email} onChange={e => setEmail(e.target.value)}
            className="w-full px-3 py-2 rounded-sm border text-sm" style={{ background: "#0F1E30", borderColor: "#2C4A6B", color: "#fff" }}
            placeholder="maria@empresa.com" />
        </Field>
        {error && <p className="text-xs mb-3" style={{ color: "#E38B6B" }}>{error}</p>}
        <button type="submit" className="w-full py-2.5 rounded-sm text-sm font-semibold" style={{ background: "#F2A93B", color: "#1F2937" }}>
          Ver status
        </button>
      </form>
    </div>
  );
}

function RequisicaoStatusView({ requisicao, onBack }) {
  const items = reqItemsList(requisicao);
  const doneCount = items.filter(it => requisicao.entregues?.[it.name]).length;
  const allDone = items.length > 0 && doneCount === items.length;
  const statusKey = allDone ? "entregue" : "pendente";

  return (
    <div className="max-w-2xl mx-auto">
      <button type="button" onClick={onBack} className="flex items-center gap-1 text-xs font-medium mb-4" style={{ color: "#9FB0C4" }}>
        <ChevronLeft size={14} /> voltar
      </button>
      <div className="rounded-md border p-5" style={{ background: "#132234", borderColor: "#223751" }}>
        <div className="flex items-start justify-between gap-3 mb-3">
          <div>
            <p className="text-lg font-bold" style={{ fontFamily: "'JetBrains Mono', monospace", color: "#fff" }}>{requisicao.id}</p>
            <p className="text-xs mt-0.5" style={{ color: "#9FB0C4" }}>{requisicao.setor} · solicitado em {timeLabel(requisicao.createdAt)}</p>
          </div>
          <ReqStampBadge statusKey={statusKey} />
        </div>
        <p className="text-xs mb-4" style={{ color: "#7C8CA0" }}>{doneCount}/{items.length} itens entregues</p>
        <div className="flex flex-col gap-2">
          {items.map(it => {
            const done = !!requisicao.entregues?.[it.name];
            return (
              <div key={it.name} className="flex items-center justify-between px-3 py-2 rounded-sm border text-xs font-medium"
                style={{ borderColor: done ? "#6FCF97" : "#2C4A6B", background: done ? "rgba(111,207,151,0.1)" : "#0F1E30", color: done ? "#6FCF97" : "#D7DEE7" }}>
                <span className="flex items-center gap-2">
                  {done ? <CheckCircle2 size={14} /> : <CircleDot size={14} />}
                  {it.name}{it.qty ? ` x${it.qty}` : ""}
                </span>
                <span className="text-[10px] font-semibold">{done ? "ENTREGUE" : "PENDENTE"}</span>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

  );
}

function itemsSummary(req) {
  const parts = Object.entries(req.itens || {}).filter(([, q]) => q > 0).map(([k, q]) => `${k} x${q}`);
  if (req.outros) parts.push(req.outros);
  return parts.length ? parts.join(", ") : "—";
}

function reqItemsList(req) {
  const list = Object.entries(req.itens || {}).filter(([, q]) => q > 0).map(([name, qty]) => ({ name, qty }));
  if (req.outros) list.push({ name: req.outros, qty: null });
  return list;
}

const MESES_PT = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];

function monthKeyLabel(iso) {
  const d = new Date(iso);
  return { key: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`, label: `${MESES_PT[d.getMonth()]}/${d.getFullYear()}` };
}

function downloadCsv(filename, rows) {
  const csv = rows.map(row => row.map(cell => `"${String(cell ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportRequisicoesCsv(requisicoes) {
  const header = ["Protocolo", "Nome", "Email", "Setor", "Data de abertura", "Itens", "Outros", "Status"];
  const rows = requisicoes.map(r => [
    r.id, r.nome, r.email, r.setor, timeLabel(r.createdAt),
    Object.entries(r.itens || {}).filter(([, q]) => q > 0).map(([k, q]) => `${k} x${q}`).join("; "),
    r.outros || "",
    r.status,
  ]);
  downloadCsv(`requisicoes-${Date.now()}.csv`, [header, ...rows]);
}

function exportRankingCsv(topItems, topPeople, selectedItem) {
  const rows = [
    ["Itens mais solicitados"],
    ["Item", "Quantidade total"],
    ...topItems.map(it => [it.name, it.qty]),
    [],
    [selectedItem ? `Quem mais pede ${selectedItem}` : "Quem mais solicita"],
    ["Nome", "Setor", "Total"],
    ...topPeople.map(p => [p.nome, p.setor, p.total]),
  ];
  downloadCsv(`ranking-materiais-${Date.now()}.csv`, rows);
}

function DashboardMateriais({ requisicoes }) {
  const [selectedItem, setSelectedItem] = useState(null);
  const [selectedPerson, setSelectedPerson] = useState(null);

  const itemTotals = {};
  requisicoes.forEach(r => {
    Object.entries(r.itens || {}).forEach(([name, qty]) => {
      if (qty > 0) itemTotals[name] = (itemTotals[name] || 0) + qty;
    });
  });
  const topItems = Object.entries(itemTotals)
    .map(([name, qty]) => ({ name, qty }))
    .sort((a, b) => b.qty - a.qty)
    .slice(0, 8);
  const maxItemQty = Math.max(1, ...topItems.map(i => i.qty));

  const personTotals = {};
  requisicoes.forEach(r => {
    const qty = selectedItem ? (r.itens?.[selectedItem] || 0) : Object.values(r.itens || {}).reduce((sum, q) => sum + (q > 0 ? q : 0), 0);
    if (qty <= 0) return;
    const key = r.email;
    if (!personTotals[key]) personTotals[key] = { nome: r.nome, setor: r.setor, email: r.email, total: 0 };
    personTotals[key].total += qty;
  });
  const topPeople = Object.values(personTotals).sort((a, b) => b.total - a.total).slice(0, 8);

  // monthly breakdown: só faz sentido com um item selecionado + uma pessoa selecionada
  let monthly = [];
  if (selectedItem && selectedPerson) {
    const byMonth = {};
    requisicoes.forEach(r => {
      if (r.email !== selectedPerson) return;
      const qty = r.itens?.[selectedItem] || 0;
      if (qty <= 0) return;
      const { key, label } = monthKeyLabel(r.createdAt);
      if (!byMonth[key]) byMonth[key] = { key, label, count: 0 };
      byMonth[key].count += 1;
    });
    monthly = Object.values(byMonth).sort((a, b) => a.key.localeCompare(b.key));
  }

  if (requisicoes.length === 0) {
    return <EmptyState icon={Inbox} title="Nenhuma requisição ainda" body="Assim que houver pedidos, os itens e solicitantes mais frequentes aparecem aqui." />;
  }

  return (
    <div>
      <div className="flex flex-wrap gap-2 mb-4">
        <button type="button" onClick={() => exportRequisicoesCsv(requisicoes)}
          className="flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-sm border" style={{ borderColor: "#2C4A6B", color: "#9FB0C4" }}>
          <Download size={13} /> Exportar requisições (CSV)
        </button>
        <button type="button" onClick={() => exportRankingCsv(topItems, topPeople, selectedItem)}
          className="flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-sm border" style={{ borderColor: "#2C4A6B", color: "#9FB0C4" }}>
          <Download size={13} /> Exportar ranking (CSV)
        </button>
      </div>

      <div className="grid sm:grid-cols-2 gap-5">
        <div className="rounded-md border p-5" style={{ background: "#132234", borderColor: "#223751" }}>
          <p className="text-[11px] font-semibold mb-1" style={{ color: "#F2A93B", letterSpacing: "0.08em" }}>ITENS MAIS SOLICITADOS</p>
          <p className="text-xs mb-4" style={{ color: "#7C8CA0" }}>Clique num item para ver quem mais pede ele</p>
          <div className="flex flex-col gap-3">
            {topItems.map(it => {
              const barWidth = Math.max(4, Math.round((it.qty / maxItemQty) * 100));
              const active = selectedItem === it.name;
              return (
                <button type="button" key={it.name} onClick={() => { setSelectedItem(active ? null : it.name); setSelectedPerson(null); }}
                  className="text-left rounded-sm -mx-1 px-1 py-0.5" style={{ background: active ? "rgba(242,169,59,0.08)" : "transparent" }}>
                  <div className="flex items-center justify-between text-xs mb-1" style={{ color: active ? "#F2A93B" : "#D7DEE7" }}>
                    <span className="font-medium">{it.name}</span>
                    <span className="font-semibold" style={{ color: active ? "#F2A93B" : "#fff" }}>{it.qty}</span>
                  </div>
                  <div className="rounded-sm" style={{ background: "#0F1E30", height: 6 }}>
                    <div className="rounded-sm" style={{ background: "#F2A93B", height: 6, width: `${barWidth}%` }} />
                  </div>
                </button>
              );
            })}
          </div>
        </div>

        <div className="rounded-md border p-5" style={{ background: "#132234", borderColor: "#223751" }}>
          <div className="flex items-center justify-between mb-1">
            <p className="text-[11px] font-semibold" style={{ color: "#F2A93B", letterSpacing: "0.08em" }}>
              {selectedItem ? `QUEM MAIS PEDE ${selectedItem.toUpperCase()}` : "QUEM MAIS SOLICITA"}
            </p>
            {selectedItem && (
              <button type="button" onClick={() => { setSelectedItem(null); setSelectedPerson(null); }} className="text-[10px] font-semibold" style={{ color: "#7C8CA0" }}>
                limpar
              </button>
            )}
          </div>
          <p className="text-xs mb-4" style={{ color: "#7C8CA0" }}>
            {selectedItem ? `Quantidade de ${selectedItem} solicitada por pessoa · clique numa pessoa para ver por mês` : "Total de itens pedidos por pessoa"}
          </p>
          {topPeople.length === 0 ? (
            <p className="text-xs" style={{ color: "#5B6B80" }}>Ninguém pediu esse item ainda.</p>
          ) : (
            <div className="flex flex-col">
              {topPeople.map((p, i) => {
                const isOpen = selectedItem && selectedPerson === p.email;
                return (
                  <div key={p.email} style={{ borderBottom: i < topPeople.length - 1 ? "1px solid #1B2E45" : "none" }}>
                    <button type="button"
                      onClick={() => selectedItem && setSelectedPerson(isOpen ? null : p.email)}
                      className="w-full flex items-center justify-between py-2 text-left">
                      <div>
                        <p className="text-xs font-semibold" style={{ color: "#fff" }}>{p.nome}</p>
                        <p className="text-[10px]" style={{ color: "#7C8CA0" }}>{p.setor}</p>
                      </div>
                      <span className="font-bold" style={{ fontFamily: "'JetBrains Mono', monospace", color: "#F2A93B", fontSize: 14 }}>{p.total}</span>
                    </button>
                    {isOpen && (
                      <div className="pb-3 pl-1">
                        {monthly.length === 0 ? (
                          <p className="text-[11px]" style={{ color: "#5B6B80" }}>Sem dados por mês.</p>
                        ) : (
                          <div className="flex flex-col gap-1.5">
                            {monthly.map(m => (
                              <div key={m.key} className="flex items-center justify-between text-[11px]">
                                <span style={{ color: "#9FB0C4" }}>{m.label}</span>
                                <span style={{ color: "#F2A93B", fontWeight: 600 }}>{m.count}x</span>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function DashboardEmpresa({ empresa, tickets }) {
  const ticketsEmpresa = tickets.filter(t => t.empresa === empresa);
  const total = ticketsEmpresa.length;

  const bucket = {};
  ticketsEmpresa.forEach(t => {
    const catLabel = catInfo(t.categoria).label;
    const label = t.subcategoria ? `${catLabel} · ${t.subcategoria}` : catLabel;
    bucket[label] = (bucket[label] || 0) + 1;
  });
  const counts = Object.entries(bucket)
    .map(([label, count]) => ({ label, count }))
    .sort((a, b) => b.count - a.count);
  const maxCount = Math.max(1, ...counts.map(c => c.count));

  return (
    <div className="rounded-md border p-5" style={{ background: "#132234", borderColor: "#223751" }}>
      <p className="text-[11px] font-semibold mb-1" style={{ color: "#F2A93B", letterSpacing: "0.08em" }}>{empresa}</p>
      <p className="text-xs mb-4" style={{ color: "#7C8CA0" }}>{total} chamado{total === 1 ? "" : "s"} no total</p>
      {total === 0 ? (
        <EmptyState icon={Inbox} title="Sem chamados" body="Ainda não há chamados registrados para esta empresa." />
      ) : (
        <div className="flex flex-col gap-3">
          {counts.map(c => {
            const pct = Math.round((c.count / total) * 100);
            const barWidth = c.count > 0 ? Math.max(4, Math.round((c.count / maxCount) * 100)) : 2;
            return (
              <div key={c.label}>
                <div className="flex items-center justify-between text-xs mb-1" style={{ color: "#D7DEE7" }}>
                  <span>{c.label}</span>
                  <span className="font-semibold" style={{ color: "#fff" }}>
                    {c.count} <span className="font-normal" style={{ color: "#7C8CA0" }}>({pct}%)</span>
                  </span>
                </div>
                <div className="rounded-sm" style={{ background: "#0F1E30", height: 6 }}>
                  <div className="rounded-sm" style={{ background: c.count > 0 ? "#F2A93B" : "#2C4A6B", height: 6, width: `${barWidth}%` }} />
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

            <div className="space-y-2">
              {filteredReq.map(r => (
                <RequisicaoCard key={r.id} r={r} onToggleItem={onToggleReqItem} />
              ))}
            </div>
          </div>
          }
        </div>
      )}
    </div>
  );
}

function TicketDetail({ ticket, thread, viewer, onBack, onSend, onStatusChange }) {
  const [msg, setMsg] = useState("");
  const [showNotif, setShowNotif] = useState(false);
  const [anexo, setAnexo] = useState(null);
  const TIcon = catInfo(ticket.categoria).icon;
  const bottomRef = useRef(null);

  useEffect(() => { bottomRef.current?.scrollIntoView({ behavior: "smooth" }); }, [thread.chat]);

  useEffect(() => {
    if (ticket.hasAnexo) {
      loadAnexo(ticket.id).then(setAnexo);
    } else {
      setAnexo(null);
    }
  }, [ticket.id, ticket.hasAnexo]);

  function handleSend(e) {
    e.preventDefault();
    if (!msg.trim()) return;
    onSend(msg);
    setMsg("");
  }

  return (
    <div className="max-w-3xl mx-auto">
      <button type="button" onClick={onBack} className="flex items-center gap-1 text-xs font-medium mb-4" style={{ color: "#9FB0C4" }}><ChevronLeft size={14} /> voltar</button>

      <div className="rounded-md border p-5 mb-4" style={{ background: "#132234", borderColor: "#223751" }}>
        <div className="flex items-start justify-between gap-3 mb-3">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 rounded-sm flex items-center justify-center shrink-0" style={{ background: "#1B2E45" }}><TIcon size={18} style={{ color: "#F2A93B" }} /></div>
            <div>
              <p className="text-lg font-bold" style={{ fontFamily: "'JetBrains Mono', monospace", color: "#fff" }}>{ticket.id}</p>
              <p className="text-xs" style={{ color: "#9FB0C4" }}>{ticket.empresa} · {ticket.setor} · {ticket.local} · aberto em {timeLabel(ticket.createdAt)}</p>
            </div>
          </div>
          <StampBadge statusKey={ticket.status} />
        </div>
        <p className="text-xs font-semibold mb-2" style={{ color: "#F2A93B" }}>
          {catInfo(ticket.categoria).label}{ticket.subcategoria ? ` · ${ticket.subcategoria}` : ""}
        </p>
        <p className="text-sm mb-3" style={{ color: "#D7DEE7" }}>{ticket.descricao}</p>
        {ticket.hasAnexo && !anexo && (
          <p className="text-xs mb-3" style={{ color: "#7C8CA0" }}>Carregando anexo...</p>
        )}
        {anexo && (
          <div className="mb-3">
            {anexo.type?.startsWith("image/") ? (
              <a href={anexo.dataUrl} target="_blank" rel="noreferrer">
                <img src={anexo.dataUrl} alt={anexo.name} className="rounded-sm border max-h-48 w-auto" style={{ borderColor: "#223751" }} />
              </a>
            ) : (
              <a href={anexo.dataUrl} download={anexo.name}
                className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-sm border text-xs font-medium"
                style={{ borderColor: "#2C4A6B", color: "#9FB0C4" }}>
                <Paperclip size={12} /> {anexo.name}
              </a>
            )}
          </div>
        )}
        <p className="text-xs" style={{ color: "#7C8CA0" }}>Solicitante: {ticket.nome} ({ticket.email})</p>

        {viewer === "facilities" && (
          <div className="flex gap-2 mt-4 pt-4 border-t" style={{ borderColor: "#223751" }}>
            {Object.keys(STATUS).map(s => (
              <button type="button" key={s} onClick={() => onStatusChange(s)} disabled={ticket.status === s}
                className="text-xs font-semibold px-3 py-1.5 rounded-sm border disabled:opacity-40" style={{ borderColor: STATUS[s].color, color: STATUS[s].color }}>
                marcar como {STATUS[s].label.toLowerCase()}
              </button>
            ))}
          </div>
        )}
      </div>

      <div className="rounded-md border mb-4 flex flex-col" style={{ background: "#132234", borderColor: "#223751", height: 340 }}>
        <div className="px-4 py-2.5 border-b text-xs font-semibold flex items-center gap-1.5" style={{ borderColor: "#223751", color: "#fff" }}><Send size={12} /> chat do chamado</div>
        <div className="flex-1 overflow-y-auto p-4 space-y-2.5">
          {thread.chat.length === 0 && <p className="text-xs text-center mt-8" style={{ color: "#5B6B80" }}>Nenhuma mensagem ainda. Envie a primeira.</p>}
          {thread.chat.map((m, i) => {
            const mine = m.sender === viewer;
            return (
              <div key={i} className={`flex ${mine ? "justify-end" : "justify-start"}`}>
                <div className="max-w-[75%]">
                  <p className="text-[10px] mb-0.5" style={{ color: "#7C8CA0", textAlign: mine ? "right" : "left" }}>{m.sender === "usuario" ? "solicitante" : "facilities"} · {timeLabel(m.time)}</p>
                  <div className="px-3 py-2 rounded-md text-sm" style={{ background: mine ? "#F2A93B" : "#1B2E45", color: mine ? "#1F2937" : "#E7ECF2" }}>{m.text}</div>
                </div>
              </div>
            );
          })}
          <div ref={bottomRef} />
        </div>
        <form onSubmit={handleSend} className="flex gap-2 p-3 border-t" style={{ borderColor: "#223751" }}>
          <input value={msg} onChange={e => setMsg(e.target.value)} placeholder="Escreva uma mensagem..." className="flex-1 px-3 py-2 rounded-sm border text-sm" style={{ background: "#0F1E30", borderColor: "#2C4A6B", color: "#fff" }} />
          <button type="submit" className="px-3 rounded-sm" style={{ background: "#F2A93B" }}><Send size={15} style={{ color: "#1F2937" }} /></button>
        </form>
      </div>

      <div className="rounded-md border" style={{ background: "#132234", borderColor: "#223751" }}>
        <button type="button" onClick={() => setShowNotif(s => !s)} className="w-full flex items-center justify-between px-4 py-2.5 text-xs font-semibold" style={{ color: "#fff" }}>
          <span className="flex items-center gap-1.5"><Mail size={12} /> notificações por e-mail enviadas ({thread.notif.length})</span>
          <span style={{ color: "#7C8CA0" }}>{showNotif ? "ocultar" : "mostrar"}</span>
        </button>
        {showNotif && (
          <div className="border-t divide-y" style={{ borderColor: "#223751" }}>
            {thread.notif.length === 0 && <p className="text-xs p-4" style={{ color: "#7C8CA0" }}>Nenhuma notificação registrada.</p>}
            {thread.notif.slice().reverse().map((n, i) => (
              <div key={i} className="px-4 py-2.5">
                <p className="text-xs font-semibold" style={{ color: "#E7ECF2" }}>{n.subject}</p>
                <p className="text-[11px] mt-0.5" style={{ color: "#7C8CA0" }}>para {n.to} · {timeLabel(n.time)}</p>
                <p className="text-xs mt-1" style={{ color: "#9FB0C4" }}>{n.body}</p>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<FacilitiesApp />);
</script>
</body>
</html>
